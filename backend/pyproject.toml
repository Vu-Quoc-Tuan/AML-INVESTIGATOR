[project]
name = "aml-investigator-backend"
version = "0.1.0"
description = "AML investigation multi-agent backend"
requires-python = ">=3.11"
dependencies = [
  "networkx>=3.0",
  "pandas>=2.0",
  "numpy>=1.26",
  "xgboost>=2.0,<4.0",
  "pydantic>=2.0",
  "fastapi>=0.100.0",
  "uvicorn>=0.20.0",
  "langchain-core>=0.1.0",
  "kafka-python>=3.0,<4.0"
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.pyright]
pythonVersion = "3.13"
venvPath = "."
extraPaths = ["."]
