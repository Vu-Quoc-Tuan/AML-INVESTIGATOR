[project]
name = "aml-investigator-backend"
version = "0.1.0"
description = "AML investigation multi-agent backend"
requires-python = ">=3.10"
dependencies = [
  "networkx>=3.0",
  "pandas>=2.0",
  "pydantic>=2.0",
  "fastapi>=0.100.0",
  "uvicorn>=0.20.0",
  "langchain-core>=0.1.0",
  "langchain-nvidia-ai-endpoints>=0.3.0",
  "python-dotenv>=1.0.0",
  "qdrant-client>=1.7.0",
  "fastembed>=0.3.0",
  "xgboost>=2.0.0",
  "scikit-learn>=1.3.0",
  "numpy>=1.24.0",
  "pymupdf4llm>=0.0.1"
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.pyright]
pythonVersion = "3.10"
venvPath = "."
venv = ".venv"
extraPaths = ["."]
