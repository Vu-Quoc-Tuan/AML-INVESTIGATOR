[project]
name = "aml-investigator-backend"
version = "0.1.0"
description = "AML investigation multi-agent backend"
requires-python = ">=3.11"
dependencies = [
  "networkx>=3.0",
  "pandas>=2.0",
  "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "ruff>=0.12,<1.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
