name: CD Frontend (Vercel)

# Architecture:
#   Browser → FE on Vercel (HTTPS :443)
#   FE → https://aml-api.vutuan.indevs.in (Cloudflare Tunnel)
#   Tunnel → 127.0.0.1:8000 (BE Docker on self-hosted server)
#
# This workflow deploys ONLY the Next.js frontend to Vercel on push.
# Backend stays on the self-hosted runner / Docker + Cloudflare.

on:
  push:
    branches:
      - feat/frontend-cd
    paths:
      - "frontend/**"
      - ".github/workflows/cd.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aml-frontend-vercel
  cancel-in-progress: true

jobs:
  deploy-vercel:
    name: Deploy frontend to Vercel
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Resolve API base URL
        shell: bash
        run: |
          set -euo pipefail
          # Public BE via Cloudflare Tunnel → 127.0.0.1:8000 on the server.
          value="${{ vars.NEXT_PUBLIC_API_BASE_URL }}"
          if [[ -z "$value" ]]; then
            value="https://aml-api.vutuan.indevs.in"
          fi
          echo "NEXT_PUBLIC_API_BASE_URL=$value" >> "$GITHUB_ENV"

      - name: Require Vercel secrets
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          [[ -n "${{ secrets.VERCEL_TOKEN }}" ]] || missing+=(VERCEL_TOKEN)
          [[ -n "${VERCEL_ORG_ID:-}" ]] || missing+=(VERCEL_ORG_ID)
          [[ -n "${VERCEL_PROJECT_ID:-}" ]] || missing+=(VERCEL_PROJECT_ID)
          if ((${#missing[@]})); then
            echo "::error title=Missing GitHub secrets::Set repository secrets: ${missing[*]}"
            echo "One-time setup:"
            echo "  1) npm i -g vercel && vercel login && cd frontend && vercel link"
            echo "  2) Copy orgId / projectId from frontend/.vercel/project.json"
            echo "  3) Create token at https://vercel.com/account/tokens"
            echo "  4) Add GitHub Actions secrets: VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID"
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel project settings
        working-directory: frontend
        run: vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Build for Vercel
        working-directory: frontend
        run: vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Deploy prebuilt production
        id: deploy
        working-directory: frontend
        run: |
          set -euo pipefail
          url="$(vercel deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}")"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed: $url"

      - name: Write deployment summary
        shell: bash
        run: |
          {
            echo "## Frontend deployed to Vercel"
            echo
            echo "- URL: ${{ steps.deploy.outputs.url }}"
            echo "- API (Cloudflare): \`$NEXT_PUBLIC_API_BASE_URL\`"
            echo "- Flow: Browser → Vercel FE → Cloudflare tunnel → BE :8000"
            echo "- Ref: \`${GITHUB_REF_NAME}\` @ \`${GITHUB_SHA:0:7}\`"
          } >> "$GITHUB_STEP_SUMMARY"
