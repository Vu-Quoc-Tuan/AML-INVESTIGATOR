name: CD

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: development
        type: choice
        options:
          - development
          - staging
      target:
        description: What to deploy
        required: true
        default: frontend
        type: choice
        options:
          - frontend
      skip_ci:
        description: Skip CI validation (temporary faster deploy)
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: aml-fe-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  reject-staging:
    name: Reject unconfigured staging deployment
    if: inputs.environment == 'staging'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Stop before deployment
        run: |
          echo "::error title=Staging is not configured::Only the development self-hosted runner is configured. No staging deployment was attempted."
          exit 1

  validate:
    name: Run CI before deployment
    if: inputs.environment == 'development' && inputs.skip_ci == false
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  deploy-frontend-development:
    name: Deploy frontend to development
    needs: validate
    if: |
      always() &&
      inputs.environment == 'development' &&
      inputs.target == 'frontend' &&
      (needs.validate.result == 'success' || needs.validate.result == 'skipped')
    runs-on:
      - self-hosted
      - Linux
      - X64
      - aml
    timeout-minutes: 30
    environment:
      name: development
    env:
      COMPOSE_PROJECT_NAME: aml-investigator
      LOCAL_HEALTH_URL: http://127.0.0.1:3000/
      # Optional public hostname via Cloudflare Tunnel. Leave empty to skip.
      PUBLIC_FRONTEND_URL: ${{ vars.PUBLIC_FRONTEND_URL }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Verify runner tooling
        shell: bash
        run: |
          set -euo pipefail
          docker version
          docker compose version

      - name: Validate frontend Compose contract
        shell: bash
        run: |
          set -euo pipefail
          compose_json="$RUNNER_TEMP/aml-compose.json"
          docker compose -p "$COMPOSE_PROJECT_NAME" config --format json > "$compose_json"
          COMPOSE_JSON="$compose_json" python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          config = json.loads(Path(os.environ["COMPOSE_JSON"]).read_text(encoding="utf-8"))
          frontend = config.get("services", {}).get("frontend")
          if frontend is None:
              raise SystemExit("Compose must define a frontend service")

          ports = frontend.get("ports", [])
          publishes_loopback = any(
              str(port.get("target")) == "3000"
              and str(port.get("published")) == "3000"
              and port.get("host_ip") == "127.0.0.1"
              for port in ports
              if isinstance(port, dict)
          )
          if not publishes_loopback:
              raise SystemExit(
                  "frontend must publish 127.0.0.1:3000:3000 before deployment"
              )

          environment = frontend.get("environment", {})
          if not isinstance(environment, dict):
              raise SystemExit("frontend environment must use Compose mapping syntax")
          if environment.get("HOSTNAME") != "0.0.0.0":
              raise SystemExit("frontend must set HOSTNAME=0.0.0.0 for container networking")
          PY

      - name: Build and deploy frontend container
        run: >-
          docker compose -p "$COMPOSE_PROJECT_NAME"
          up --detach --build --remove-orphans frontend

      - name: Wait for local frontend health
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..36}; do
            if curl --fail --silent --max-time 5 "$LOCAL_HEALTH_URL" > /dev/null; then
              echo "Local frontend health check passed on attempt $attempt."
              exit 0
            fi
            sleep 2
          done

          echo "::error title=Local health check failed::$LOCAL_HEALTH_URL did not become healthy within ~72 seconds."
          docker compose -p "$COMPOSE_PROJECT_NAME" ps
          docker compose -p "$COMPOSE_PROJECT_NAME" logs --tail 200 frontend
          exit 1

      - name: Verify public Cloudflare endpoint (optional)
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${PUBLIC_FRONTEND_URL:-}" ]]; then
            echo "PUBLIC_FRONTEND_URL is not set; skipping public endpoint check."
            echo "Configure vars.PUBLIC_FRONTEND_URL (e.g. https://aml.vutuan.indevs.in/) after Cloudflare Tunnel is ready."
            exit 0
          fi

          for attempt in {1..10}; do
            if curl --fail --silent --max-time 10 "$PUBLIC_FRONTEND_URL" > /dev/null; then
              echo "Public frontend check passed on attempt $attempt."
              exit 0
            fi
            sleep 3
          done

          echo "::error title=Public health check failed::$PUBLIC_FRONTEND_URL is unavailable. Check Cloudflare Tunnel / DNS."
          docker compose -p "$COMPOSE_PROJECT_NAME" ps
          docker compose -p "$COMPOSE_PROJECT_NAME" logs --tail 200 frontend
          exit 1

      - name: Write deployment summary
        shell: bash
        run: |
          {
            echo "## Development frontend deployed"
            echo
            echo "- Runner labels: \`self-hosted, Linux, X64, aml\`"
            echo "- Compose project: \`$COMPOSE_PROJECT_NAME\`"
            echo "- Local health: \`$LOCAL_HEALTH_URL\`"
            if [[ -n "${PUBLIC_FRONTEND_URL:-}" ]]; then
              echo "- Public URL: \`$PUBLIC_FRONTEND_URL\`"
            else
              echo "- Public URL: not configured (\`vars.PUBLIC_FRONTEND_URL\`)"
            fi
            echo "- Image registry: not used (build on runner)"
            echo "- Skip CI: \`${{ inputs.skip_ci }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
